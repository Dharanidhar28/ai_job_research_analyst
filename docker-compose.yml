services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on: []

  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "3000:80"

    volumes:
      - ./frontend:/usr/share/nginx/html

