[tool.poetry]
name = "resume-agent-backend"
version = "0.1.0"
description = "FastAPI backend for resume analysis and job search"
authors = ["You <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100.0"
uvicorn = {extras=["standard"],version="^0.22.0"}
python-multipart = "^0.0.6"
sqlmodel = "^0.0.8"
aiohttp = "^3.8.0"
pydantic = "^2.6.0"
PyMuPDF = "^1.22.0"
spacy = "^3.7.0"
authlib = "^1.2.0"
passlib = "^1.7.4"
python-jose = "^3.3.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
